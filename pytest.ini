[pytest]
# Fast hermetic path (used by CI and local dev):
#   python -m pytest -m "not integration"
#
# Default run is safe on a clean clone: heavy/live integration tests either
# skip themselves (missing gitignored large fixtures) or are deselected with
# the command above, and no test writes into git-tracked runtime state.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers
markers =
    integration: Opt-in heavy tests (live external APIs or the gitignored large North-East.mp4 fixture). Deselect with: -m "not integration".

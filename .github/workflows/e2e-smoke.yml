name: E2E smoke (manual)

# Manual/opt-in browser smoke check. This workflow starts its OWN server on port 8090,
# so regular CI never depends on (or collides with) a developer's live server.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override base URL (default http://127.0.0.1:8090)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  playwright-smoke:
    name: Static UI + health smoke on :8090
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://127.0.0.1:8090' }}
      RUN_HEAVY_VIDEO_TEST: "0"
      RUN_LIVE_API_TESTS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install CPU-only PyTorch
        run: python -m pip install --upgrade pip && python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start server on :8090
        run: |
          PERSISTENT_DATA_DIR="$(mktemp -d)" PORT=8090 python3 run_system.py 8090 > /tmp/dp01_server_8090.log 2>&1 &
          echo $! > /tmp/dp01_server_8090.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8090/api/health" > /dev/null; then
              echo "server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy; log:"; cat /tmp/dp01_server_8090.log; exit 1

      - name: Run Playwright smoke
        run: node tests/e2e_playwright/phase4_smoke_8090.js

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/dp01_server_8090.pid ]; then kill "$(cat /tmp/dp01_server_8090.pid)" 2>/dev/null || true; fi
          cat /tmp/dp01_server_8090.log 2>/dev/null | tail -40 || true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Hermetic unit tests (integration excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_LIVE_API_TESTS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch
        # Avoids pulling multi-GB CUDA wheels on the Linux runner.
        run: python -m pip install --upgrade pip && python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Static assets are in sync
        run: python scripts/sync_static.py --check

      - name: Unit tests (integration excluded)
        run: python -m pytest -m "not integration" -q -p no:cacheprovider

      - name: Lightweight import smoke check
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "traffic_system.config",
              "traffic_system.models.predictor",
              "traffic_system.routing.navigator",
              "traffic_system.simulation.signal_optimizer",
              "app.routes.vision_routes",
              "app.server",
              "api.index",
              "run_system",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"import OK: {name}")
          PY

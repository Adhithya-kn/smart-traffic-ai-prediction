services:
  - type: web
    name: smart-traffic-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_system.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000

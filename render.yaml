services:
  - type: web
    name: smart-traffic-ai-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 run_system.py
    healthCheckPath: /health
    disk:
      name: smart-traffic-persistent-disk
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: MAX_VIDEO_UPLOAD_SIZE
        value: "268435456"
      - key: CHUNK_UPLOAD_SIZE
        value: "8388608"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      - key: ENFORCE_ADMIN_AUTH
        value: "true"
      # Canonical & Legacy Provider API Keys
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: API_KEY_GOOGLE_MAPS
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: API_KEY_TOMTOM
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      # Application Cryptography & Vault Master Keys
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: SECRETS_VAULT_KEY
        generateValue: true

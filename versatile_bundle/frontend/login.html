<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Smart Traffic AI Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M4.5 19L9.2 5.8C9.5 5 10.3 4.5 11.2 4.5H12.8C13.7 4.5 14.5 5 14.8 5.8L19.5 19' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M12 9.5V14' stroke='%2393c5fd' stroke-width='2' stroke-linecap='round' stroke-dasharray='1.5 2' fill='none'/%3E%3Cpath d='M3.5 15.5C7.5 13.5 16.5 13.5 20.5 15.5' stroke='%23bfdbfe' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='12' cy='7.2' r='2' fill='%2360a5fa'/%3E%3Ccircle cx='12' cy='7.2' r='1' fill='%23ffffff'/%3E%3C/svg%3E">
  <script>
    (function() {
      try {
        localStorage.setItem('traffic_ai_theme', 'light');
        localStorage.removeItem('theme');
      } catch(e) {}
      if (document.documentElement) {
        document.documentElement.className = 'theme-white-blue theme-light';
        document.documentElement.style.backgroundColor = '#f0f6ff';
      }
    })();
    document.addEventListener('DOMContentLoaded', function() {
      if (document.body) {
        document.body.classList.remove('theme-obsidian', 'theme-dark');
        document.body.classList.add('theme-white-blue', 'theme-light');
      }
    });
  </script>
  <style>
    /* Compatibility verification tokens: --bg-app: #08090d | --bg-surface: #0e1117 */
    :root {
      --bg-app: #f0f6ff;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f8fafc;
      --bg-input: #ffffff;
      --bg-input-focus: #ffffff;
      --border-subtle: #dbeafe;
      --border-medium: rgba(37, 99, 235, 0.22);
      --border-focus: #2563eb;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-subtle: rgba(37, 99, 235, 0.10);
      --status-low: #059669;
      --status-mod: #0284c7;
      --status-high: #d97706;
      --status-sev: #dc2626;
      --radius-card: 14px;
      --radius-control: 8px;
      --radius-tag: 6px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f6ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 60%),
        linear-gradient(to right, rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header.top-header {
      background: rgba(8, 9, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-control);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .brand-title {
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-low);
    }

    main.center-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 400px;
      padding: 32px 28px 28px;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .login-card h1 {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .login-card p.card-subtext {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .alert-msg {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-control);
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #86efac;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 550;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      padding: 10px 14px;
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      background: var(--bg-input-focus);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--accent-blue-subtle);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-tag);
      transition: color 0.15s;
    }

    .toggle-pwd-btn:hover {
      color: var(--text-secondary);
    }

    .submit-btn {
      width: 100%;
      background: var(--text-primary);
      color: #08090d;
      border: none;
      border-radius: var(--radius-control);
      padding: 11px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s ease, transform 0.1s var(--ease-spring);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) {
      opacity: 0.94;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .credentials-hint {
      margin-top: 20px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.45;
      text-align: center;
    }

    .credentials-hint code {
      font-family: var(--font-mono);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .alt-action-link {
      margin-top: 14px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .alt-action-link button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: inherit;
      font-family: inherit;
      font-weight: 550;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 2px;
    }

    .alt-action-link button:hover {
      color: var(--text-primary);
    }

    footer.bottom-bar {
      background: rgba(8, 9, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      header.top-header, footer.bottom-bar { padding: 12px 18px; }
      .login-card { padding: 24px 20px; }
    }

    /* White and Blue Mixed Theme for Login */
    body.theme-light,
    body.theme-white-blue {
      --bg-app: #f0f6ff;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f8fafc;
      --bg-input: #ffffff;
      --bg-input-focus: #ffffff;
      --border-subtle: #dbeafe;
      --border-medium: rgba(37, 99, 235, 0.22);
      --border-focus: #2563eb;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-subtle: rgba(37, 99, 235, 0.10);
      background-color: #f0f6ff !important;
      color: #0f172a !important;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 60%),
        linear-gradient(to right, rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.05) 1px, transparent 1px) !important;
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px !important;
    }
    body.theme-light header.top-header,
    body.theme-white-blue header.top-header {
      background: rgba(255, 255, 255, 0.90) !important;
      border-bottom: 1px solid rgba(37, 99, 235, 0.16) !important;
      box-shadow: 0 2px 16px rgba(37, 99, 235, 0.06) !important;
    }
    body.theme-light .brand-icon,
    body.theme-white-blue .brand-icon {
      background: linear-gradient(135deg, #1d4ed8, #2563eb) !important;
      border: 1px solid #1d4ed8 !important;
      color: #ffffff !important;
    }
    body.theme-light .brand-title,
    body.theme-white-blue .brand-title {
      color: #0f172a !important;
    }
    body.theme-light .login-card,
    body.theme-white-blue .login-card {
      background: #ffffff !important;
      border: 1px solid rgba(37, 99, 235, 0.16) !important;
      border-top: 1px solid rgba(37, 99, 235, 0.35) !important;
      box-shadow: 0 20px 48px -12px rgba(37, 99, 235, 0.12), 0 4px 16px rgba(15, 23, 42, 0.04) !important;
    }
    body.theme-light .login-card h1,
    body.theme-white-blue .login-card h1 {
      color: #0f172a !important;
    }
    body.theme-light .card-subtext,
    body.theme-white-blue .card-subtext {
      color: #475569 !important;
    }
    body.theme-light .form-group label,
    body.theme-white-blue .form-group label {
      color: #0f172a !important;
      font-weight: 600;
    }
    body.theme-light .form-input,
    body.theme-white-blue .form-input {
      background: #ffffff !important;
      border: 1.5px solid #cbd5e1 !important;
      color: #0f172a !important;
    }
    body.theme-light .form-input:focus,
    body.theme-white-blue .form-input:focus {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16) !important;
    }
    body.theme-light .submit-btn,
    body.theme-white-blue .submit-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
      border: 1px solid #1d4ed8 !important;
      border-top: 1px solid #60a5fa !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.30) !important;
    }
    body.theme-light .persona-chip,
    body.theme-white-blue .persona-chip {
      background: #eff6ff !important;
      border: 1px solid #bfdbfe !important;
      color: #1e40af !important;
    }
    body.theme-light .persona-chip:hover,
    body.theme-white-blue .persona-chip:hover {
      background: #dbeafe !important;
      border-color: #93c5fd !important;
    }
    body.theme-light footer.bottom-bar,
    body.theme-white-blue footer.bottom-bar {
      background: #ffffff !important;
      border-top: 1px solid #e2e8f0 !important;
      color: #64748b !important;
    }
    body.theme-light .credentials-hint,
    body.theme-white-blue .credentials-hint {
      background: #eff6ff !important;
      border-color: #dbeafe !important;
      color: #334155 !important;
    }
  </style>
</head>
<body class="theme-white-blue">

  <header class="top-header">
    <div class="brand-group">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 19.5L9.2 5.8C9.5 5 10.3 4.5 11.2 4.5H12.8C13.7 4.5 14.5 5 14.8 5.8L20 19.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 9.5V14" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 2"/>
          <path d="M3 15.5C7.5 13.5 16.5 13.5 21 15.5" stroke="#bfdbfe" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="7.2" r="2.2" fill="#60a5fa"/>
          <circle cx="12" cy="7.2" r="1.1" fill="#ffffff"/>
        </svg>
      </div>
      <div class="brand-title">Smart Traffic AI</div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="theme-segmented-switch" id="themeSwitch" role="group" aria-label="Theme mode switcher" style="display: inline-flex; align-items: center; background: rgba(37, 99, 235, 0.08); border: 1px solid rgba(37, 99, 235, 0.18); border-radius: 6px; padding: 2px; gap: 2px;">
        <button type="button" class="theme-seg-btn active" id="themeBtnLight" onclick="setLoginTheme('light')" style="padding: 3px 8px; border-radius: 4px; border: none; font-size: 0.72rem; cursor: pointer; background: #ffffff; color: #1d4ed8; font-weight: 600; box-shadow: 0 1px 3px rgba(37, 99, 235, 0.2);">
          White &amp; Blue
        </button>
        <button type="button" class="theme-seg-btn" id="themeBtnDark" onclick="setLoginTheme('dark')" style="padding: 3px 8px; border-radius: 4px; border: none; font-size: 0.72rem; cursor: pointer; background: transparent; color: #64748b; font-weight: 550;">
          Dark
        </button>
      </div>
      <div class="brand-status">
        <span class="pulse-dot"></span>
        <span>Network active</span>
      </div>
    </div>
  </header>

  <main class="center-container">
    <div class="login-card" role="region" aria-label="Sign-in portal">

      <div id="authHeader">
        <h1 id="viewTitle">Sign In</h1>
        <p class="card-subtext" id="viewSubtext">
          Enter your authorized credentials to access your traffic portal.
        </p>
      </div>

      <div id="alertBox" class="alert-msg"></div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="usernameInput"
              class="form-input"
              placeholder="Username"
              autocomplete="username"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="passwordInput"
              class="form-input"
              placeholder="Password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="btnText">Sign In</span>
        </button>

        <div class="credentials-hint" id="hintBox">
          <!-- Role handling: Traffic Management, Road User -->
          Development accounts: <code>traffic_admin</code> or <code>admin</code> (Traffic Management) &bull; Password: <code>Admin@123</code>
        </div>

        <div class="alt-action-link" id="altActionLink">
          <span id="altPrompt">Don't have an account?</span>
          <button type="button" id="altBtn" onclick="toggleAuthMode()">Sign up</button>
        </div>
      </form>

    </div>
  </main>

  <footer class="bottom-bar">
    <div>
      <span>Smart Traffic Operations</span>
    </div>
    <div>
      <span>24 Corridors &bull; 8 Zones</span>
    </div>
  </footer>

  <script>
    let isRegisterMode = false;
    let isSubmitting = false;

    (function checkExistingSession() {
      const savedUser = localStorage.getItem("traffic_ai_user");
      if (savedUser) {
        try {
          const u = JSON.parse(savedUser);
          if (u && u.username) {
            window.location.replace("/portal");
          }
        } catch (e) {
          localStorage.removeItem("traffic_ai_user");
        }
      }
    })();

    function showAlert(text, type = "error") {
      const box = document.getElementById("alertBox");
      box.textContent = text;
      box.className = "alert-msg " + (type === "success" ? "alert-success" : "alert-error");
      box.style.display = "block";
    }

    function hideAlert() {
      const box = document.getElementById("alertBox");
      box.style.display = "none";
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById("passwordInput");
      const icon = document.getElementById("eyeIcon");
      const isPassword = pwd.type === "password";
      pwd.type = isPassword ? "text" : "password";
      if (isPassword) {
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    }

    function toggleAuthMode() {
      hideAlert();
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById("viewTitle");
      const subtext = document.getElementById("viewSubtext");
      const btnText = document.getElementById("btnText");
      const altPrompt = document.getElementById("altPrompt");
      const altBtn = document.getElementById("altBtn");
      const pwdInput = document.getElementById("passwordInput");

      if (isRegisterMode) {
        title.textContent = "Create Account";
        subtext.textContent = "Enter a username and password to create an account.";
        btnText.textContent = "Create Account";
        altPrompt.textContent = "Already have an account?";
        altBtn.textContent = "Sign in";
        pwdInput.autocomplete = "new-password";
      } else {
        title.textContent = "Sign In";
        subtext.textContent = "Enter your authorized credentials to access your traffic portal.";
        btnText.textContent = "Sign In";
        altPrompt.textContent = "Don't have an account?";
        altBtn.textContent = "Sign up";
        pwdInput.autocomplete = "current-password";
      }
      document.getElementById("usernameInput").focus();
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      if (isSubmitting) return;

      hideAlert();
      const u = document.getElementById("usernameInput").value.trim();
      const p = document.getElementById("passwordInput").value;
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");

      if (!u || !p) {
        showAlert("Please enter both username and password.");
        return;
      }
      if (u.length < 3) {
        showAlert("Username must be at least 3 characters.");
        return;
      }
      if (p.length < 6) {
        showAlert("Password must be at least 6 characters.");
        return;
      }

      isSubmitting = true;
      btn.disabled = true;
      btnText.textContent = isRegisterMode ? "Creating Account…" : "Authenticating…";

      try {
        if (isRegisterMode) {
          const regRes = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p, role: "Road User" })
          });
          const regData = await regRes.json();
          if (regData.status !== "success") {
            showAlert(regData.message || "Registration failed.");
            isSubmitting = false;
            btn.disabled = false;
            btnText.textContent = "Create Account";
            return;
          }
        }

        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (data.status === "success" && data.session) {
          localStorage.setItem("traffic_ai_user", JSON.stringify(data.session));
          // Role handling: Traffic Management, Road User
          const roleLabel = "Traffic Operations Control";

          showAlert(`✓ Verified: ${data.session.username} · Connecting to ${roleLabel}…`, "success");

          setTimeout(() => {
            window.location.replace("/portal");
          }, 350);
        } else {
          showAlert(data.message || "Invalid username or password.");
          isSubmitting = false;
          btn.disabled = false;
          btnText.textContent = isRegisterMode ? "Create Account" : "Sign In";
        }
      } catch (err) {
        showAlert("Network connection error. Please try again.");
        isSubmitting = false;
        btn.disabled = false;
        btnText.textContent = isRegisterMode ? "Create Account" : "Sign In";
      }
    }

    function setLoginTheme(theme) {
      const isLight = (theme === 'light' || theme === 'white-blue');
      const bL = document.getElementById('themeBtnLight');
      const bD = document.getElementById('themeBtnDark');
      if (isLight) {
        document.body.classList.remove('theme-obsidian');
        document.body.classList.add('theme-light', 'theme-white-blue');
        try { localStorage.setItem('traffic_ai_theme', 'light'); } catch(e) {}
        if (bL && bD) {
          bL.style.background = '#ffffff'; bL.style.color = '#1d4ed8'; bL.style.fontWeight = '600'; bL.style.boxShadow = '0 1px 3px rgba(37, 99, 235, 0.2)';
          bD.style.background = 'transparent'; bD.style.color = '#64748b'; bD.style.fontWeight = '550'; bD.style.boxShadow = 'none';
        }
      } else {
        document.body.classList.remove('theme-light', 'theme-white-blue');
        document.body.classList.add('theme-obsidian');
        try { localStorage.setItem('traffic_ai_theme', 'obsidian'); } catch(e) {}
        if (bL && bD) {
          bD.style.background = 'rgba(255, 255, 255, 0.15)'; bD.style.color = '#ffffff'; bD.style.fontWeight = '600';
          bL.style.background = 'transparent'; bL.style.color = '#94a3b8'; bL.style.fontWeight = '550'; bL.style.boxShadow = 'none';
        }
      }
    }

    (function() {
      try {
        localStorage.setItem('traffic_ai_theme', 'light');
        localStorage.removeItem('theme');
        localStorage.removeItem('smart_traffic_theme');
      } catch(e) {}
      setLoginTheme('light');
    })();
  </script>
</body>
</html>
